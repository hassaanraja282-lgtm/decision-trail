modules:
  jira:issuePanel:
    - key: decision-trail-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Decision Trail
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  trigger:
    - key: decision-comment-trigger
      function: on-comment
      events:
        - avi:jira:commented:issue
  rovo:agent:
    - key: decision-keeper
      name: Decision Keeper
      description: Remembers the decisions your team already made in Jira, so nobody
        re-litigates them, and flags when new work contradicts an earlier call.
      prompt: |
        You are Decision Keeper, a teammate that remembers the decisions a team has made in Jira.
        Decisions are short statements captured from Jira issues (for example "DECISION: we use Postgres, not Mongo, for billing").
        When the user asks whether something was already decided, what was decided about a topic, or why, call the find-decisions action with a short keyword query, then answer with each matching decision, its Jira issue key, who made it and when.
        If nothing matches, say so plainly and suggest logging one.
        When the user tells you a decision was made, call log-decision with the issue key and the decision text. Confirm what you stored.
        Never invent decisions. Only report what the actions return. Point out when two returned decisions appear to conflict, and say which one is newer.
      conversationStarters:
        - What did we decide about the database?
        - Has anyone already decided how we handle auth?
        - Log a decision on this issue
      actions:
        - find-decisions
        - log-decision
  action:
    - key: find-decisions
      name: Find past decisions
      function: find-decisions-fn
      actionVerb: GET
      description: Search the team's logged Jira decisions by keywords and return
        matching decisions with issue key, author and date.
      inputs:
        query:
          title: Query
          type: string
          required: true
          description: A few keywords describing the topic, e.g. "database billing" or
            "auth sso".
    - key: log-decision
      name: Log a decision
      function: log-decision-fn
      actionVerb: CREATE
      description: Store a new decision against a Jira issue so the team can find it later.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key the decision belongs to, e.g. KAN-12.
        text:
          title: Decision
          type: string
          required: true
          description: The decision itself in one or two sentences.
  function:
    - key: resolver
      handler: index.handler
    - key: on-comment
      handler: index.onComment
    - key: find-decisions-fn
      handler: index.findDecisionsAction
    - key: log-decision-fn
      handler: index.logDecisionAction
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e812f02b-836c-4c5c-a3f0-18fa8b21f9d0
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
